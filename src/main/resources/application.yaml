spring:
  application:
    name: dataanalysis

  datasource:
    url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

spark:
  app:
    name: csv-aggregation-app
  master: local[*]
  executor:
    memory: 2g
    cores: 2
  driver:
    memory: 1g