<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOT CLIMBING — 데이터 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #c8f135;
      --accent2: #ff4d00;
      --text: #f0f0f0;
      --muted: #555;
      --success: #2ecc71;
      --error: #e74c3c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 배경 그리드 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,241,53,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,241,53,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    /* 헤더 */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 64px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
      line-height: 1;
    }

    .logo span {
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    /* 섹션 타이틀 */
    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* 업로드 카드 */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    .upload-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px;
      position: relative;
      transition: border-color 0.2s;
    }

    .upload-card:hover {
      border-color: var(--accent);
    }

    .upload-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .upload-card:hover::before {
      opacity: 1;
    }

    .card-type {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    /* 드롭존 */
    .dropzone {
      border: 1px dashed var(--border);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      margin-bottom: 16px;
    }

    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(200,241,53,0.03);
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .dropzone-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .dropzone-text {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .dropzone-text strong {
      color: var(--accent);
      display: block;
      font-size: 12px;
      margin-top: 4px;
    }

    /* 파일 목록 */
    .file-list {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(200,241,53,0.05);
      border: 1px solid rgba(200,241,53,0.15);
      padding: 8px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .file-name {
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .file-remove {
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .file-remove:hover { color: var(--error); }

    /* 업로드 버튼 */
    .btn-upload {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn-upload:hover:not(:disabled) {
      background: #d4f545;
      transform: translateY(-1px);
    }

    .btn-upload:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .btn-upload.loading {
      background: var(--border);
      color: var(--muted);
    }

    /* 결과 로그 */
    .log-section {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .log-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .log-clear:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .log-body {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      min-height: 120px;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-entry {
      display: flex;
      gap: 12px;
      animation: slideIn 0.2s ease;
    }

    .log-time {
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-msg { color: var(--text); }
    .log-msg.success { color: var(--success); }
    .log-msg.error { color: var(--error); }
    .log-msg.info { color: var(--accent); }

    .log-empty {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 20px 0;
      text-align: center;
    }

    /* 반응형 */
    @media (max-width: 640px) {
      .upload-grid { grid-template-columns: 1fr; }
      .logo { font-size: 36px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">DOT<span>.</span>DATA</div>
    <div style="display:flex; align-items:center; gap:24px;">
      <nav style="display:flex; gap:16px;">
        <a href="index.html" style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--accent); text-decoration:none;">CSV 업로드</a>
        <a href="spark.html" style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted); text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">SPARK JOBS</a>
      </nav>
      <div class="status-label">
        <span class="status-dot"></span>SYSTEM ONLINE
      </div>
    </div>
  </header>

  <div class="section-title">// CSV 파일 업로드</div>

  <div class="upload-grid">
    <!-- 회계현황 카드 -->
    <div class="upload-card">
      <div class="card-type">TYPE_01</div>
      <div class="card-title">일반회계현황</div>

      <div class="dropzone" id="dropzone-accounting">
        <input type="file" id="files-accounting" multiple accept=".csv">
        <div class="dropzone-icon">📂</div>
        <div class="dropzone-text">
          드래그 또는 클릭
          <strong>CSV 파일만 가능</strong>
        </div>
      </div>

      <div class="file-list" id="list-accounting"></div>

      <button class="btn-upload" id="btn-accounting" onclick="upload('accounting')" disabled>
        업로드 &amp; 저장
      </button>
    </div>

    <!-- 출석현황 카드 -->
    <div class="upload-card">
      <div class="card-type">TYPE_02</div>
      <div class="card-title">일별출석현황</div>

      <div class="dropzone" id="dropzone-attendance">
        <input type="file" id="files-attendance" multiple accept=".csv">
        <div class="dropzone-icon">📂</div>
        <div class="dropzone-text">
          드래그 또는 클릭
          <strong>CSV 파일만 가능</strong>
        </div>
      </div>

      <div class="file-list" id="list-attendance"></div>

      <button class="btn-upload" id="btn-attendance" onclick="upload('attendance')" disabled>
        업로드 &amp; 저장
      </button>
    </div>
  </div>

  <!-- 로그 -->
  <div class="log-section">
    <div class="log-header">
      <div class="section-title" style="margin-bottom:0">// 실행 로그</div>
      <button class="log-clear" onclick="clearLog()">CLEAR</button>
    </div>
    <div class="log-body" id="log-body">
      <div class="log-empty" id="log-empty">대기 중...</div>
    </div>
  </div>
</div>

<script>
  const fileMap = { accounting: [], attendance: [] };

  // 파일 인풋 이벤트
  ['accounting', 'attendance'].forEach(type => {
    const input = document.getElementById(`files-${type}`);
    input.addEventListener('change', () => handleFiles(type, input.files));

    // 드래그앤드롭
    const zone = document.getElementById(`dropzone-${type}`);
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      handleFiles(type, e.dataTransfer.files);
    });
  });

  function handleFiles(type, files) {
    Array.from(files).forEach(f => {
      if (!f.name.endsWith('.csv')) {
        addLog(`${f.name} — CSV 파일만 가능합니다`, 'error');
        return;
      }
      if (!fileMap[type].find(x => x.name === f.name)) {
        fileMap[type].push(f);
      }
    });
    renderFileList(type);
  }

  function renderFileList(type) {
    const list = document.getElementById(`list-${type}`);
    const btn = document.getElementById(`btn-${type}`);
    list.innerHTML = '';

    fileMap[type].forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="file-name">${f.name}</span>
        <button class="file-remove" onclick="removeFile('${type}', ${i})">✕</button>
      `;
      list.appendChild(item);
    });

    btn.disabled = fileMap[type].length === 0;
  }

  function removeFile(type, idx) {
    fileMap[type].splice(idx, 1);
    renderFileList(type);
  }

  async function upload(type) {
    const files = fileMap[type];
    if (!files.length) return;

    const btn = document.getElementById(`btn-${type}`);
    const label = type === 'accounting' ? '회계현황' : '출석현황';
    const endpoint = `/api/csv/${type}`;

    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = '처리 중...';

    addLog(`${label} 업로드 시작 — ${files.length}개 파일`, 'info');

    const formData = new FormData();
    files.forEach(f => formData.append('files', f));

    try {
      const res = await fetch(endpoint, { method: 'POST', body: formData });
      const text = await res.text();

      if (res.ok) {
        addLog(`${label} — ${text}`, 'success');
        fileMap[type] = [];
        renderFileList(type);
      } else {
        addLog(`${label} 실패 — ${res.status} ${text}`, 'error');
      }
    } catch (e) {
      addLog(`${label} 오류 — ${e.message}`, 'error');
    } finally {
      btn.classList.remove('loading');
      btn.textContent = '업로드 & 저장';
      btn.disabled = fileMap[type].length === 0;
    }
  }

  function addLog(msg, type = 'info') {
    const body = document.getElementById('log-body');
    const empty = document.getElementById('log-empty');
    if (empty) empty.remove();

    const now = new Date();
    const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">${time}</span><span class="log-msg ${type}">${msg}</span>`;
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;
  }

  function clearLog() {
    const body = document.getElementById('log-body');
    body.innerHTML = '<div class="log-empty" id="log-empty">대기 중...</div>';
  }
</script>
</body>
</html>
