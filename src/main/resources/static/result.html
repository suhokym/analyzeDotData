<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOT CLIMBING — 집계 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #ff4d00;
      --accent2: #c8f135;
      --text: #f0f0f0;
      --muted: #555;
      --success: #2ecc71;
      --error: #e74c3c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,77,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,77,0,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 64px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
      line-height: 1;
    }

    .logo span { color: var(--accent); }

    .status-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* 요약 카드 */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 48px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px 28px;
      position: relative;
    }

    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
    }

    .summary-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .summary-value {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--accent);
      word-break: break-all;
    }

    .summary-value.large {
      font-size: 28px;
    }

    .summary-value.neutral {
      color: var(--text);
      font-size: 13px;
    }

    /* 차트 블록 */
    .chart-block {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px;
      margin-bottom: 32px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 56px 1fr 180px;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .bar-track {
      background: var(--border);
      height: 26px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0;
      transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-meta {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar-count {
      font-size: 10px;
      color: var(--muted);
    }

    /* 테이블 */
    .table-block {
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .table-scroll {
      max-height: 400px;
      overflow-y: auto;
    }

    .table-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .table-scroll::-webkit-scrollbar-track {
      background: var(--border);
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background: var(--muted);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
    }

    .result-table thead {
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    .result-table th {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-align: left;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
    }

    .result-table td {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 11px 20px;
      border-bottom: 1px solid rgba(34,34,34,0.7);
      color: var(--text);
    }

    .result-table tr:last-child td { border-bottom: none; }

    .result-table tbody tr:hover td {
      background: rgba(255,77,0,0.04);
    }

    .td-amount { color: var(--accent); }
    .td-muted  { color: var(--muted); }

    /* 상태 메시지 */
    .state-msg {
      text-align: center;
      padding: 80px 24px;
      font-family: 'DM Mono', monospace;
    }

    .state-title {
      font-size: 15px;
      color: var(--text);
      margin-bottom: 10px;
    }

    .state-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .state-sub a {
      color: var(--accent);
      text-decoration: none;
    }

    .state-sub a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .summary-grid { grid-template-columns: 1fr; }
      .logo { font-size: 36px; }
      .bar-row { grid-template-columns: 40px 1fr; }
      .bar-meta { display: none; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">DOT<span>.</span>RESULT</div>
    <div style="display:flex; align-items:center; gap:24px;">
      <nav style="display:flex; gap:16px;">
        <a href="index.html" style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted); text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">CSV 업로드</a>
        <a href="spark.html" style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted); text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">SPARK JOBS</a>
        <a href="result.html" style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--accent); text-decoration:none;">집계 결과</a>
      </nav>
      <div class="status-label">
        <span class="status-dot"></span>RESULTS
      </div>
    </div>
  </header>

  <div id="main-content">
    <div class="state-msg">
      <div class="state-title">로딩 중...</div>
    </div>
  </div>
</div>

<script>
  const DAY_KO = { Sun: '일(Sun)', Mon: '월(Mon)', Tue: '화(Tue)', Wed: '수(Wed)', Thu: '목(Thu)', Fri: '금(Fri)', Sat: '토(Sat)' };

  function won(n) {
    return '₩' + Number(n).toLocaleString('ko-KR');
  }

  function bars(items, labelFn, amountFn, countFn) {
    const max = Math.max(...items.map(i => amountFn(i)));
    return items.map(item => {
      const pct = max > 0 ? (amountFn(item) / max * 100).toFixed(1) : 0;
      return `
        <div class="bar-row">
          <div class="bar-label">${labelFn(item)}</div>
          <div class="bar-track">
            <div class="bar-fill" data-pct="${pct}"></div>
          </div>
          <div class="bar-meta">
            <span>${won(amountFn(item))}</span>
            <span class="bar-count">${countFn(item)}건</span>
          </div>
        </div>`;
    }).join('');
  }

  function dailyRows(items) {
    return items.map(d => `
      <tr>
        <td>${d.date}</td>
        <td class="td-amount">${won(d.totalAmount)}</td>
        <td class="td-muted">${d.count}건</td>
      </tr>`).join('');
  }

  function render(data) {
    const main = document.getElementById('main-content');
    const calcAt = data.calculatedAt ? data.calculatedAt.replace('T', ' ').substring(0, 19) : '-';

    main.innerHTML = `
      <div class="section-title">// 요약</div>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-label">총 매출</div>
          <div class="summary-value large">${won(data.totalSales)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">집계 일시</div>
          <div class="summary-value neutral">${calcAt}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">집계 기간</div>
          <div class="summary-value neutral">${data.monthlySales.length}개월 / ${data.dailySales.length}일</div>
        </div>
      </div>

      <div class="section-title">// 요일별 매출</div>
      <div class="chart-block" id="weekly-chart">
        ${bars(data.weeklySales,
          w => DAY_KO[w.dayOfWeek] || w.dayOfWeek,
          w => w.totalAmount,
          w => w.count)}
      </div>

      <div class="section-title">// 월별 매출</div>
      <div class="chart-block" id="monthly-chart">
        ${bars(data.monthlySales,
          m => m.month,
          m => m.totalAmount,
          m => m.count)}
      </div>

      <div class="section-title">// 일별 매출</div>
      <div class="table-block">
        <div class="table-scroll">
          <table class="result-table">
            <thead>
              <tr>
                <th>날짜</th>
                <th>매출</th>
                <th>건수</th>
              </tr>
            </thead>
            <tbody>${dailyRows(data.dailySales)}</tbody>
          </table>
        </div>
      </div>
    `;

    // 바 애니메이션
    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(el => {
        el.style.width = el.dataset.pct + '%';
      });
    }, 60);
  }

  function showEmpty() {
    document.getElementById('main-content').innerHTML = `
      <div class="state-msg">
        <div class="state-title">집계 데이터가 없습니다</div>
        <div class="state-sub">
          <a href="spark.html">Spark Jobs</a> 페이지에서 회계현황 집계를 먼저 실행해주세요.
        </div>
      </div>`;
  }

  function showError(msg) {
    document.getElementById('main-content').innerHTML = `
      <div class="state-msg">
        <div class="state-title" style="color:var(--error)">오류 발생</div>
        <div class="state-sub">${msg}</div>
      </div>`;
  }

  async function load() {
    try {
      const res = await fetch('/api/spark/result/accounting');
      if (res.status === 204 || res.status === 404) { showEmpty(); return; }
      if (!res.ok) { showError(`${res.status} ${res.statusText}`); return; }
      render(await res.json());
    } catch (e) {
      showError(e.message);
    }
  }

  load();
</script>
</body>
</html>
